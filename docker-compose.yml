# Services for the integration tests and the example envcheck.yaml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: envcheck
      POSTGRES_PASSWORD: envcheck
      POSTGRES_DB: envcheck
    ports: ["55438:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envcheck"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "envcheck-pass"]
    ports: ["56385:6379"]
